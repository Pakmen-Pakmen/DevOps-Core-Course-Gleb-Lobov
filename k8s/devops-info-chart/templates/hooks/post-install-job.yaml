{{- if .Values.hooks.postInstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-chart.fullname" . }}-post-install"
  labels:
    {{- include "devops-info-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "{{ .Values.hooks.postInstall.weight }}"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "devops-info-chart.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-smoke
          image: "{{ .Values.hooks.image }}"
          command:
            - sh
            - -c
            - |
              echo "Post-install smoke test started";
              echo "Service: {{ include "devops-info-chart.fullname" . }}";
              sleep 2;
              echo "Post-install smoke test passed";
{{- end }}
