{{- if .Values.hooks.preInstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-chart.fullname" . }}-pre-install"
  labels:
    {{- include "devops-info-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "{{ .Values.hooks.preInstall.weight }}"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "devops-info-chart.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install-check
          image: "{{ .Values.hooks.image }}"
          command:
            - sh
            - -c
            - |
              echo "Pre-install check started for release {{ .Release.Name }}";
              echo "Namespace: {{ .Release.Namespace }}";
              sleep 2;
              echo "Pre-install check completed";
{{- end }}
